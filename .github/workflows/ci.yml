name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Test CP1-CP4
    runs-on: ubuntu-latest
    env:
      API_TOKEN: ci-dummy-token
      REDIS_URL: fake://
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests that do not require a live deployment
        run: >-
          python -m pytest
          tests/test_cp1.py
          tests/test_cp2.py
          tests/test_cp3.py
          tests/test_cp4.py
          -v

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag day12-chat:${{ github.sha }} .

  deploy:
    name: Deploy
    needs: [test, build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
    steps:
      - name: Trigger Render deployment
        if: env.RENDER_DEPLOY_HOOK != ''
        run: curl --fail --silent --show-error --request POST "$RENDER_DEPLOY_HOOK"
      - name: Report local fallback
        if: env.RENDER_DEPLOY_HOOK == ''
        run: echo "No cloud deploy hook configured; keeping the verified local fallback."
